<svg viewBox="0 0 500 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Acabamento Rose Gold / Blush Dourado da Placa Oficial -->
    <linearGradient id="roseGold" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stopColor="#FFF0F3" />
      <stop offset="25%" stopColor="#F9D4DC" />
      <stop offset="55%" stopColor="#EAB3BF" />
      <stop offset="85%" stopColor="#D98E9F" />
      <stop offset="100%" stopColor="#C97587" />
    </linearGradient>

    <!-- Gradiente de Brilho Suave para 'Glamour' em escrita cursiva -->
    <linearGradient id="scriptRose" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#FFFFFF" />
      <stop offset="30%" stopColor="#FDE4EA" />
      <stop offset="70%" stopColor="#EBB3C0" />
      <stop offset="100%" stopColor="#FFFFFF" />
    </linearGradient>

    <filter id="subtleGlow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Fundo Circular Preto Ônix Oficial -->
  <circle cx="250" cy="250" r="250" fill="#000000" />

  <!-- ============================================================== -->
  <!-- MONOGRAMA JB OFICIAL INTEGRADO: LETRA 'J' 100% NÍTIDA E LEGÍVEL -->
  <!-- ============================================================== -->
  <g filter="url(#subtleGlow)">
    <!-- 1. LETRA 'J' LIMPA, ELEGANTE E PERFEITAMENTE LEGÍVEL -->
    <!-- Serifa horizontal superior do 'J' com acabamentos clássicos -->
    <path
      d="M 194 82 L 254 82 C 255.5 82 256.5 83 256.5 84.5 C 256.5 86 255.5 87 254 87 L 246 87 L 246 90 L 202 90 L 202 87 L 194 87 C 192.5 87 191.5 86 191.5 84.5 C 191.5 83 192.5 82 194 82 Z"
      fill="url(#roseGold)"
    />

    <!-- Corpo vertical do 'J' descendo em linha reta pura e fazendo a curva inferior aberta à esquerda -->
    <!-- Haste principal vertical límpida e gancho curvo bem desenhado -->
    <path
      d="M 238 87 L 246 87 L 246 256 C 246 270 242 282 232 291 C 221 300 206 303 191 299 C 174 294 163 279 163 260 C 163 244 174 233 188 233 C 199 233 207 241 207 252 C 207 262 199 270 188 270 C 185 270 181 269 178 267 C 180 277 189 285 200 288 C 210 290 221 288 228 281 C 235 274 238 264 238 253 Z"
      fill="url(#roseGold)"
    />

    <!-- 2. LETRA 'B' ENTRELAÇADA HARMONIOSAMENTE COM O 'J' -->
    <!-- Base horizontal com serifa na haste do 'B' -->
    <path
      d="M 228 290 L 272 290 C 273.5 290 274.5 291 274.5 292.5 C 274.5 294 273.5 295 272 295 L 228 295 C 226.5 295 225.5 294 225.5 292.5 C 225.5 291 226.5 290 228 290 Z"
      fill="url(#roseGold)"
    />

    <!-- Bojo Superior do B (harmonioso e aberto à direita) -->
    <path
      d="M 246 114 C 274 114 308 120 322 143 C 333 162 327 183 310 195 C 298 203 280 206 246 206 L 246 198 C 276 198 291 195 302 188 C 314 179 319 163 310 148 C 298 129 271 122 246 122 Z"
      fill="url(#roseGold)"
    />

    <!-- Bojo Inferior do B (mais amplo, arredondado e gracioso) -->
    <path
      d="M 246 202 C 280 202 320 207 337 232 C 351 254 345 282 320 297 C 297 310 266 310 236 310 L 236 302 C 263 302 292 302 312 290 C 332 277 336 254 324 237 C 310 216 277 210 246 210 Z"
      fill="url(#roseGold)"
    />
  </g>

  <!-- ============================================================== -->
  <!-- TIPOGRAFIA OFICIAL: JÔ BOLSAS                                   -->
  <!-- ============================================================== -->
  <text
    x="250"
    y="346"
    text-anchor="middle"
    fill="url(#roseGold)"
    font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif"
    font-size="33"
    font-weight="500"
    letter-spacing="14"
  >
    JÔ BOLSAS
  </text>

  <!-- ============================================================== -->
  <!-- LINHA DIVISÓRIA COM CORAÇÃO CENTRAL: —— ♥ ——                   -->
  <!-- ============================================================== -->
  <line x1="168" y1="368" x2="236" y2="368" stroke="url(#roseGold)" stroke-width="1.6" stroke-linecap="round" />
  
  <!-- Mini Coração Central -->
  <path
    d="M 250 374.8 C 250 374.8 243.5 369 241.5 365.2 C 239.5 361.5 242 359 245.2 359 C 248 359 249.5 361.2 250 362.2 C 250.5 361.2 252 359 254.8 359 C 258 359 260.5 361.5 258.5 365.2 C 256.5 369 250 374.8 250 374.8 Z"
    fill="url(#roseGold)"
  />

  <line x1="264" y1="368" x2="332" y2="368" stroke="url(#roseGold)" stroke-width="1.6" stroke-linecap="round" />

  <!-- ============================================================== -->
  <!-- ESCRITA CURSIVA 'Glamour'                                      -->
  <!-- ============================================================== -->
  <text
    x="250"
    y="426"
    text-anchor="middle"
    fill="url(#scriptRose)"
    font-family="'Great Vibes', 'Cormorant Garamond', cursive"
    font-size="64"
    font-weight="400"
    font-style="italic"
  >
    Glamour
  </text>
</svg>
